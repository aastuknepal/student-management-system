<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher | SMS</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        /* ADDED 'select' to the rule below so it matches your other inputs */
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        #message { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Register New Teacher</h2>
    
    <div id="message"></div>

    <form id="teacherForm">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" required>
                <option value="cs">Computer Science</option>
                <option value="math">Mathematics</option>
                <option value="physics">Physics</option>
                <option value="bio">Biology</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date_of_joining">Date of Joining</label>
            <input type="date" id="date_of_joining" required>
        </div>

        <div class="form-group">
            <label for="description">Description (Bio/Details)</label>
            <textarea id="description" rows="4"></textarea>
        </div>

        <button type="submit">Save Teacher</button>
    </form>

    <script>
        document.getElementById('teacherForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            // 2. GRAB THE CSRF TOKEN VALUE FROM THE HIDDEN INPUT
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            
            const teacherData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                date_of_joining: document.getElementById('date_of_joining').value,
                description: document.getElementById('description').value
            };

            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none'; // Hide message while processing

            try {
                // 3. RELATIVE URL FOR THE API
                const response = await fetch('/api/teachers/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // 4. ATTACH THE TOKEN TO THE HEADERS
                        'X-CSRFToken': csrfToken  
                    },
                    body: JSON.stringify(teacherData)
                });

                messageDiv.style.display = 'block';

                if (response.ok) {
                    const result = await response.json();
                    messageDiv.style.backgroundColor = '#d4edda';
                    messageDiv.style.color = '#155724';
                    messageDiv.innerText = `Success! ${result.name} added to ${result.department} department.`;
                    document.getElementById('teacherForm').reset(); 
                } else {
                    // Smart Error Handling (Checks if response is JSON before parsing)
                    const contentType = response.headers.get("content-type");
                    messageDiv.style.backgroundColor = '#f8d7da';
                    messageDiv.style.color = '#721c24';

                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        const errorData = await response.json();
                        messageDiv.innerText = `Validation Error: ${JSON.stringify(errorData)}`; 
                    } else {
                        messageDiv.innerText = `Server Error (${response.status}): Check your terminal logs!`;
                    }
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                messageDiv.style.display = 'block';
                messageDiv.style.backgroundColor = '#f8d7da';
                messageDiv.style.color = '#721c24';
                messageDiv.innerText = `Network Error: Could not connect to the server.`;
            }
        });
    </script>
</body>
</html>
