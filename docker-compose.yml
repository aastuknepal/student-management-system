version: '3.8'

services:
  #  The Redis Container
  redis:
    image: redis:latest
    container_name: sms_redis
    ports:
      - "6379:6379"

  #  The Django Web Application Container
  web:
    build: .
    container_name: sms_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # The Celery Worker Container
  celery:
    build: .
    container_name: sms_celery
    command: celery -A sms worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
